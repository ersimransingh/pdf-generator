<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Generator SaaS - Template Editor</title>
  <script>
    (function() {
      var path = window.location.pathname || '/';
      window.PDF_GEN_BASE = path === '/pdfgenerator' || path.indexOf('/pdfgenerator/') === 0 ? '/pdfgenerator' : '';
    })();
  </script>
  <link rel="stylesheet" href="./public/css/admin.css?v=2">
  <link href="https://cdn.jsdelivr.net/npm/suneditor@2.47.0/dist/css/suneditor.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.css">
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1>PDF Generator</h1>
      <nav>
        <button id="btn-new" class="nav-btn primary">+ New Template</button>
        <button id="btn-list" class="nav-btn">My Templates</button>
        <button id="btn-docs" class="nav-btn">API Docs</button>
      </nav>
      <div id="template-list" class="template-list"></div>
    </aside>

    <main class="main">
      <div id="editor-view" class="view">
        <header class="toolbar">
          <input type="text" id="template-name" placeholder="Template Name" class="name-input">
          <input type="text" id="template-desc" placeholder="Description" class="desc-input">
          <div class="actions">
            <button id="btn-preview-pdf" class="btn">Preview PDF</button>
            <button id="btn-download" class="btn">Download PDF</button>
            <button id="btn-save" class="btn primary">Save Template</button>
          </div>
        </header>

        <div class="options-bar">
          <div class="option-group">
            <label>Page Size</label>
            <select id="preview-size">
              <option value="A4">A4</option>
              <option value="Letter">Letter</option>
              <option value="Legal">Legal</option>
              <option value="A3">A3</option>
            </select>
          </div>
          <div class="option-group">
            <label>Orientation</label>
            <select id="preview-orientation">
              <option value="portrait">Portrait</option>
              <option value="landscape">Landscape</option>
            </select>
          </div>
          <div class="option-group margins">
            <label>Margins (px)</label>
            <div class="margin-inputs">
              <input type="text" id="margin-top" value="20px" title="Top">
              <input type="text" id="margin-right" value="20px" title="Right">
              <input type="text" id="margin-bottom" value="20px" title="Bottom">
              <input type="text" id="margin-left" value="20px" title="Left">
            </div>
          </div>
        </div>

        <div class="editor-layout">
          <div class="panel code-panel">
            <div class="tabs">
              <button class="tab-btn active" data-tab="html">HTML</button>
              <button class="tab-btn" data-tab="data">Sample Data (JSON)</button>
              <button class="tab-btn" data-tab="header">Header HTML</button>
              <button class="tab-btn" data-tab="footer">Footer HTML</button>
              <button class="tab-btn" data-tab="watermark">Watermark</button>
            </div>
            <div class="tab-content">
              <!-- HTML Editor -->
              <div id="html-editor-wrapper" class="editor-wrapper">
                <div class="editor-toolbar">
                  <button type="button" class="btn btn-small" id="btn-insert-variable">📌 Insert Variable</button>
                </div>
                <div id="html-rich-wrapper" class="rich-editor-wrapper" style="display: flex; flex: 1;">
                  <div id="html-rich-editor"></div>
                </div>
              </div>

              <!-- Data Editor -->
              <div id="data-editor-wrapper" class="code-editor editor-wrapper hidden">
                <textarea id="data-editor" class="code-editor" placeholder='{"key": "value"}'></textarea>
              </div>

              <!-- Header Editor -->
              <div id="header-editor-wrapper" class="editor-wrapper hidden">
                <div class="editor-toolbar">
                  <button type="button" class="btn btn-small js-editor-snippet" data-editor-target="header" data-pdf-var="pageNumber">Page No</button>
                  <button type="button" class="btn btn-small js-editor-snippet" data-editor-target="header" data-pdf-var="totalPages">Total Pages</button>
                  <button type="button" class="btn btn-small js-editor-snippet" data-editor-target="header" data-pdf-var="date">Date</button>
                  <button type="button" class="btn btn-small js-editor-snippet" data-editor-target="header" data-pdf-var="title">Title</button>
                  <button type="button" class="btn btn-small js-editor-snippet" data-editor-target="header" data-pdf-var="url">URL</button>
                </div>
                <div id="header-rich-wrapper" class="rich-editor-wrapper" style="display: flex; flex: 1;">
                  <div id="header-rich-editor"></div>
                </div>
              </div>

              <!-- Footer Editor -->
              <div id="footer-editor-wrapper" class="editor-wrapper hidden">
                <div class="editor-toolbar">
                  <button type="button" class="btn btn-small js-editor-snippet" data-editor-target="footer" data-pdf-var="pageNumber">Page No</button>
                  <button type="button" class="btn btn-small js-editor-snippet" data-editor-target="footer" data-pdf-var="totalPages">Total Pages</button>
                  <button type="button" class="btn btn-small js-editor-snippet" data-editor-target="footer" data-pdf-var="date">Date</button>
                  <button type="button" class="btn btn-small js-editor-snippet" data-editor-target="footer" data-pdf-var="title">Title</button>
                  <button type="button" class="btn btn-small js-editor-snippet" data-editor-target="footer" data-pdf-var="url">URL</button>
                </div>
                <div id="footer-rich-wrapper" class="rich-editor-wrapper" style="display: flex; flex: 1;">
                  <div id="footer-rich-editor"></div>
                </div>
                <div class="footer-options" style="padding: 10px; border-top: 1px solid #e2e8f0; background: #f8fafc;">
                  <label style="display: block; font-size: 12px; color: #475569; margin-bottom: 4px;">Skip footer on pages</label>
                  <input type="text" id="footer-skip-pages" placeholder="e.g. 1, 3, 5 or first, last" style="width: 100%; padding: 6px 8px; font-size: 13px; border: 1px solid #cbd5e1; border-radius: 4px; font-family: inherit;">
                  <span style="font-size: 11px; color: #94a3b8; margin-top: 4px; display: block;">Comma-separated page numbers. Use "first" or "last" for first/last page.</span>
                </div>
              </div>

              <!-- Watermark Editor -->
              <div id="watermark-editor" class="code-editor hidden watermark-panel">
                <div class="watermark-row">
                  <label>Type</label>
                  <div class="radio-group">
                    <label><input type="radio" name="wm-type" value="text" checked> Text</label>
                    <label><input type="radio" name="wm-type" value="image"> Image</label>
                  </div>
                </div>

                <div id="wm-text-controls">
                  <div class="watermark-row">
                    <label>Text</label>
                    <input type="text" id="wm-text" placeholder="DRAFT">
                  </div>
                  <div class="watermark-row">
                    <label>Opacity</label>
                    <input type="range" id="wm-opacity" min="1" max="30" value="8">
                    <span id="wm-opacity-val">0.08</span>
                  </div>
                  <div class="watermark-row">
                    <label>Color</label>
                    <input type="color" id="wm-color" value="#000000">
                  </div>
                  <div class="watermark-row">
                    <label>Font Size</label>
                    <input type="text" id="wm-fontsize" value="100px">
                  </div>
                  <div class="watermark-row">
                    <label>Angle</label>
                    <input type="range" id="wm-angle" min="-90" max="90" value="-45">
                    <span id="wm-angle-val">-45°</span>
                  </div>
                </div>

                <div id="wm-image-controls" class="hidden">
                  <div class="watermark-row">
                    <label>Upload</label>
                    <input type="file" id="wm-image-file" accept="image/png,image/jpeg,image/jpg">
                    <span class="hint">Max 500KB (PNG, JPG)</span>
                  </div>
                  <div class="watermark-row">
                    <label></label>
                    <div id="wm-image-preview" class="image-preview hidden">
                      <img id="wm-preview-img" src="" alt="Watermark preview">
                      <button type="button" id="wm-remove-image" class="btn btn-small btn-danger">Remove Image</button>
                    </div>
                  </div>
                  <div class="watermark-row">
                    <label>Opacity</label>
                    <input type="range" id="wm-image-opacity" min="1" max="30" value="8">
                    <span id="wm-image-opacity-val">0.08</span>
                  </div>
                </div>

                <div class="watermark-row">
                  <label><input type="checkbox" id="wm-enabled"> Enable Watermark</label>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="list-view" class="view hidden">
        <h2>My Templates</h2>
        <div id="templates-grid" class="templates-grid"></div>
      </div>

      <div id="docs-view" class="view hidden">
        <h2>API Documentation</h2>
        <div id="docs-content" class="docs-content"></div>
      </div>
    </main>
  </div>

  <div id="pdf-preview-modal" class="pdf-preview-modal hidden">
    <div class="pdf-preview-content">
      <div class="pdf-preview-header">
        <h3>PDF Preview</h3>
        <button id="close-pdf-modal" class="btn">&times; Close</button>
      </div>
      <div class="pdf-preview-body">
        <iframe id="pdf-preview-frame"></iframe>
        <div id="pdf-preview-loader" class="preview-loader hidden">
          <div class="spinner"></div>
          <p>Generating PDF...</p>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast"></div>

  <!-- Delete confirmation modal -->
  <div id="delete-confirm-modal" class="confirm-modal-overlay hidden">
    <div class="confirm-modal">
      <div class="confirm-icon">🗑️</div>
      <h3>Delete Template</h3>
      <p id="delete-confirm-msg">Are you sure you want to delete this template? This action cannot be undone.</p>
      <div class="confirm-actions">
        <button class="btn" id="delete-confirm-cancel">Cancel</button>
        <button class="btn btn-danger" id="delete-confirm-ok">Delete</button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/suneditor@2.47.0/dist/suneditor.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/xml/xml.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/css/css.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/javascript/javascript.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/htmlmixed/htmlmixed.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closetag.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/closebrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchbrackets.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/foldcode.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/fold/xml-fold.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/edit/matchtags.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/show-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/xml-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/html-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/css-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/javascript-hint.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/addon/hint/anyword-hint.min.js"></script>
  <script src="./public/js/admin.js?v=2"></script>
</body>
</html>
